name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: |
          flake8 .

      - name: Run tests
        run: |
          pytest tests/

      - name: Build (compile Python sources)
        run: |
          python -m compileall .

      - name: Deploy (placeholder)
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "Deploy step (à remplacer par un vrai déploiement)"